<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAME</title>
  <link rel="icon" href="assets/img/logopage.png" type="image/x-icon">

  <style>
    @font-face{
      font-family:"Montaser Arabic";
      src:url("assets/fonts/MontaserArabic-Bold.woff2") format("woff2");
      font-weight:700; font-style:normal; font-display:swap;
    }
    @font-face{
      font-family:"Univers";
      src:url("assets/fonts/Univers-Regular.woff2") format("woff2");
      font-weight:400; font-style:normal; font-display:swap;
    }
    @font-face{
      font-family:"Univers";
      src:url("assets/fonts/Univers-Bold.woff2") format("woff2");
      font-weight:700; font-style:normal; font-display:swap;
    }

    :root{
      --page-xdur: 320ms;
      --page-xease: cubic-bezier(.2,.6,.2,1);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    html{scroll-behavior:smooth}
    body{
      margin:0; color:#fff; background:#000;
      font-family:"Univers", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow:hidden;

      opacity:0; transform:translateY(8px);
      transition:
        opacity var(--page-xdur) var(--page-xease),
        transform var(--page-xdur) var(--page-xease);
    }
    body.is-loaded{ opacity:1; transform:none; }
    body.is-exiting{ opacity:0; transform:translateY(8px); }

    /* ===== FOND VIDÉO ===== */
    .bg{ position:fixed; inset:0; z-index:-2; overflow:hidden; }
    .bg video,.bg img{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover; object-position:center;
      display:block;
      filter:contrast(1.05) saturate(1.05);
    }
    .bg::after{
      content:""; position:absolute; inset:0;
      background:linear-gradient(0deg, rgba(0,0,0,.45), rgba(0,0,0,.35));
      z-index:1;
      pointer-events:none;
    }

    /* ===== HERO ===== */
    .hero{
      position:fixed; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap: clamp(20px, 5vmin, 48px);
      padding: max(24px, env(safe-area-inset-top)) 2rem max(24px, env(safe-area-inset-bottom) + 6vh);
      text-align:center;
    }

    /* LOGO — ne dépasse jamais l’écran en largeur */
    .logo{ display:grid; place-items:center; }
    .logo img{
      width: clamp(200px, 60vw, 520px);   /* mieux sur mobile */
      max-width: 92vw;                    /* sécurité supplémentaire */
      height:auto; display:block;
      filter: drop-shadow(0 12px 40px rgba(0,0,0,.45));
      user-select:none; -webkit-user-drag:none;
    }

    /* BOUTON ENTRER = TITRE (Montaser Arabic gras) */
    .enter{
      font-family:"MontaserArabic","Montaser Arabic",serif;
      font-weight:700;
      font-size: clamp(24px, 7.5vw, 56px);  /* lisible sur tel */
      letter-spacing:.02em;
      color:#fff; text-decoration:none;
      padding:.5rem 1.2rem;
      text-shadow:0 3px 14px rgba(0,0,0,.9);
      -webkit-text-stroke: .8px rgba(0,0,0,.55);
      transition: transform .15s ease, text-shadow .15s ease;
    }
    .enter:hover{
      transform:translateY(-2px) scale(1.02);
      text-shadow:0 6px 18px rgba(0,0,0,1);
    }

    /* — Ajustements spécifiques téléphone — */
    @media (max-width:700px){
      .bg::after{
        /* un peu plus de contraste pour bien voir le logo/texte */
        background:linear-gradient(0deg, rgba(0,0,0,.58), rgba(0,0,0,.44));
      }
      .hero{ gap: clamp(16px, 4vh, 28px); }
      .enter{ -webkit-text-stroke: .5px rgba(0,0,0,.55); }
    }

    /* Accessibilité */
    @media (prefers-reduced-motion: reduce){
      body{ transition:none !important; transform:none !important; opacity:1 !important; }
      .enter{ transition:none !important; }
    }
  </style>
</head>
<body>

  <!-- FOND -->
  <div class="bg" aria-hidden="true">
    <!-- garde ta vidéo actuelle -->
    <video src="assets/video/page2.mp4" autoplay muted loop playsinline poster="media/montreal.jpg"></video>
  </div>

  <!-- CONTENU CENTRAL -->
  <main class="hero">
    <div class="logo" aria-hidden="false">
      <img src="assets/img/logopage1.png" alt="Logo RAME">
    </div>

    <a class="enter" href="page2.html" aria-label="Entrer sur le site">Entrer</a>
  </main>

  <!-- Transition de page -->
  <script>
    function showPage(){ document.body.classList.add('is-loaded'); }
    addEventListener('DOMContentLoaded', showPage);
    addEventListener('pageshow', showPage);

    document.addEventListener('click', function(e){
      const a = e.target.closest('a[href]');
      if(!a) return;
      if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      if(a.hasAttribute('download') || (a.target && a.target !== '_self')) return;

      const href = a.getAttribute('href');
      if(!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) return;

      const url = new URL(href, location.href);
      if((url.protocol !== 'http:' && url.protocol !== 'https:') || url.origin !== location.origin) return;

      e.preventDefault();
      document.body.classList.remove('is-loaded');
      document.body.classList.add('is-exiting');
      setTimeout(()=>{ location.href = url.href; }, 320);
    }, true);
  </script>
</body>
</html>
