<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAME</title>
  <link rel="icon" href="assets/img/logopage.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">

  <style>
    :root{
      --pink:#f72585; --pink-dark:#b5179e;
      --blue:#3a0ca3; --blue-bright:#4361ee;
      --page-xdur: 320ms;
      --page-xease: cubic-bezier(.2,.6,.2,1);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:#fff; background:#000;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      overflow:hidden;

      /* transition page */
      opacity:0; transform:translateY(8px);
      transition:
        opacity var(--page-xdur) var(--page-xease),
        transform var(--page-xdur) var(--page-xease);
    }
    body.is-loaded{ opacity:1; transform:none; }
    body.is-exiting{ opacity:0; transform:translateY(8px); }

    /* ===== FOND VIDÉO ===== */
    .bg{ position:fixed; inset:0; z-index:-2; overflow:hidden; }
    .bg video,.bg img{
      width:100%; height:100%; object-fit:cover; display:block;
      filter:contrast(1.05) saturate(1.05);
    }
    .bg::after{
      content:""; position:absolute; inset:0;
      background:linear-gradient(0deg, rgba(0,0,0,.45), rgba(0,0,0,.35));
      z-index:1;
    }

    /* ===== HERO ===== */
    .hero{
      position:fixed; inset:0;            /* plein écran (pas de barre en haut) */
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap: clamp(24px, 5vmin, 48px);
      padding: 2rem; text-align:center;
    }

    /* LOGO perso */
    .logo{
      display:grid; place-items:center;
    }
    .logo img{
      width: clamp(180px, 200vmin, 520px);   /* adapte la taille du logo */
      height:auto; display:block;
      filter: drop-shadow(0 12px 40px rgba(0,0,0,.45));
      user-select:none; -webkit-user-drag:none;
    }

    /* BOUTON ENTRER (plus gros) */
    .enter{
      font-family:'Chewy', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: clamp(34px, 6.5vw, 72px);   /* >> plus grand << */
      letter-spacing:.03em;
      color:#fff; text-decoration:none;
      padding:.5rem 1.2rem;
      text-shadow:0 3px 14px rgba(0,0,0,.9);
      -webkit-text-stroke: 1px rgba(0,0,0,.6);
      transition: transform .15s ease, text-shadow .15s ease;
    }
    .enter:hover{
      transform:translateY(-2px) scale(1.02);
      text-shadow:0 6px 18px rgba(0,0,0,1);
    }

    /* Accessibilité : moins d’anim si demandé */
    @media (prefers-reduced-motion: reduce){
      body{ transition:none !important; transform:none !important; opacity:1 !important; }
      .enter{ transition:none !important; }
    }
  </style>
</head>
<body>

  <!-- FOND -->
  <div class="bg" aria-hidden="true">
    <video src="assets/video/page1.mp4" autoplay muted loop playsinline poster="media/montreal.jpg"></video>
  </div>

  <!-- CONTENU CENTRAL -->
  <main class="hero">
    <!-- Ton logo -->
    <div class="logo" aria-hidden="false">
      <img src="assets/img/logo.png" alt="Logo RAME">
    </div>

    <!-- Bouton -->
    <a class="enter" href="page2.html" aria-label="Entrer sur le site">Entrer</a>
  </main>

  <!-- Transition de page -->
  <script>
    function showPage(){ document.body.classList.add('is-loaded'); }
    addEventListener('DOMContentLoaded', showPage);
    addEventListener('pageshow', showPage);

    document.addEventListener('click', function(e){
      const a = e.target.closest('a[href]');
      if(!a) return;

      if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      if(a.hasAttribute('download') || (a.target && a.target !== '_self')) return;

      const href = a.getAttribute('href');
      if(!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) return;

      const url = new URL(href, location.href);
      const isHttp = url.protocol === 'http:' || url.protocol === 'https:';
      const sameOrigin = url.origin === location.origin;
      if(!isHttp || !sameOrigin) return;

      e.preventDefault();
      document.body.classList.remove('is-loaded');
      document.body.classList.add('is-exiting');
      setTimeout(()=>{ location.href = url.href; }, 320);
    }, true);
  </script>
</body>
</html>
